<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAKVADE - Snapchat Insights Prank</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d0f12; color: #fff; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #12151a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2d3442; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#0d0f12] text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { 
          Lock, Eye, Users, MessageSquare, Search, Loader2, Sparkles, 
          ChevronRight, ShieldCheck, RefreshCw, Flame, Heart, Star, 
          Clock, ArrowLeft, CheckCircle2 
        } = LucideReact;

        const MOCK_PROFILES_POOL = [
          { name: 'Ella', username: 'ella_vibe', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80', status: '3h', streak: '137', emoji: '🔥' },
          { name: 'Lily', username: 'lily.flower', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80', status: '1d', streak: '94', emoji: '💛' },
          { name: 'Mia', username: 'mia.xo', avatar: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150&auto=format&fit=crop&q=80', status: '5h', streak: '210', emoji: '❤️' },
          { name: 'Chloe', username: 'chloe_sun', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80', status: '6h', streak: '68', emoji: '😊' },
          { name: 'Emma', username: 'emma.glow', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80', status: '2h', streak: '77', emoji: '⭐' },
          { name: 'Hannah', username: 'hannah_bee', avatar: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&auto=format&fit=crop&q=80', status: '2h', streak: '102', emoji: '💕' },
          { name: 'Sophia', username: 'sophia.rose', avatar: 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=150&auto=format&fit=crop&q=80', status: '12m', streak: '312', emoji: '🔥' },
          { name: 'Ava', username: 'ava_style', avatar: 'https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=150&auto=format&fit=crop&q=80', status: '4h', streak: '45', emoji: '😊' },
          { name: 'Olivia', username: 'liv_night', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80', status: '1h', streak: '189', emoji: '❤️' },
          { name: 'Isabella', username: 'bella.luna', avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150&auto=format&fit=crop&q=80', status: '30m', streak: '254', emoji: '🔥' }
        ];

        function App() {
          const [targetUsername, setTargetUsername] = useState('jack.schwarz881');
          const [inputUsername, setInputUsername] = useState('jack.schwarz881');
          const [isEditingUser, setIsEditingUser] = useState(false);
          const [activeTab, setActiveTab] = useState('home');
          const [selectedFeature, setSelectedFeature] = useState(null);
          const [currentFriendsList, setCurrentFriendsList] = useState([]);
          const [scanProgress, setScanProgress] = useState(0);
          const [scanMessage, setScanMessage] = useState('');

          const randomizeFriends = () => {
            const shuffled = [...MOCK_PROFILES_POOL].sort(() => 0.5 - Math.random());
            setCurrentFriendsList(shuffled.slice(0, 8));
          };

          const startScan = (featureName) => {
            setSelectedFeature(featureName);
            randomizeFriends();
            setActiveTab('loading');
            setScanProgress(0);

            const messages = [
              `Connecting to server...`,
              `Locating target user @${targetUsername}...`,
              `Bypassing privacy filters...`,
              `Fetching encrypted data...`,
              `Generating viewer layout...`
            ];

            let step = 0;
            const interval = setInterval(() => {
              step++;
              setScanProgress((prev) => Math.min(prev + 20, 100));
              if (step < messages.length) {
                setScanMessage(messages[step]);
              } else {
                clearInterval(interval);
                setTimeout(() => setActiveTab('results'), 500);
              }
            }, 600);
          };

          const handleUserChangeSubmit = (e) => {
            e.preventDefault();
            if (inputUsername.trim()) {
              setTargetUsername(inputUsername.trim());
              setIsEditingUser(false);
            }
          };

          return (
            <div className="min-h-screen bg-[#0d0f12] text-white font-sans flex flex-col justify-between">
              {/* Header */}
              <header className="border-b border-gray-800 bg-[#12151a]/90 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
                <div className="max-w-md mx-auto flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <div className="w-8 h-8 rounded-full bg-yellow-400 flex items-center justify-center font-black text-black text-lg shadow-lg">S</div>
                    <div>
                      <h1 className="font-extrabold text-lg tracking-wider bg-gradient-to-r from-yellow-400 to-yellow-500 bg-clip-text text-transparent">STREAKVADE</h1>
                      <p className="text-[10px] text-gray-400 -mt-1 tracking-widest uppercase">Snapchat Insights</p>
                    </div>
                  </div>
                  <button onClick={randomizeFriends} className="p-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-yellow-400 transition" title="Shuffle Data">
                    <RefreshCw size={16} />
                  </button>
                </div>
              </header>

              {/* Main Content */}
              <main className="max-w-md mx-auto w-full flex-1 p-4 flex flex-col justify-center">
                {activeTab === 'home' && (
                  <div className="space-y-4">
                    <div className="bg-[#181c24] border border-gray-800 rounded-2xl p-4 shadow-xl">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                          <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80" alt="Avatar" className="w-12 h-12 rounded-full border-2 border-yellow-400/80 object-cover" />
                          <div>
                            <div className="text-xs text-gray-400">Target Account</div>
                            <div className="text-base font-bold flex items-center gap-1">@{targetUsername} <CheckCircle2 size={14} className="text-yellow-400" /></div>
                          </div>
                        </div>
                        <button onClick={() => setIsEditingUser(!isEditingUser)} className="px-3 py-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-xs font-semibold">
                          {isEditingUser ? 'Cancel' : 'Change'}
                        </button>
                      </div>
                      {isEditingUser && (
                        <form onSubmit={handleUserChangeSubmit} className="mt-3 pt-3 border-t border-gray-800 flex gap-2">
                          <input type="text" value={inputUsername} onChange={(e) => setInputUsername(e.target.value)} className="w-full bg-[#11141a] border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-yellow-400" />
                          <button type="submit" className="px-4 py-2 bg-yellow-400 text-black font-bold text-sm rounded-xl">Set</button>
                        </form>
                      )}
                    </div>

                    <div className="space-y-3">
                      <div className="text-xs uppercase tracking-wider font-bold text-gray-400 px-1">Tools</div>
                      {[
                        { title: 'Best Friend List', desc: 'Reveal top 8 best friends', icon: <Users size={20} />, color: 'text-yellow-400 bg-yellow-500/10' },
                        { title: 'My Eyes Only', desc: 'Request protected memories', icon: <Lock size={20} />, color: 'text-purple-400 bg-purple-500/10' },
                        { title: 'Snap Score & Profile Views', desc: 'See who secretly viewed profile', icon: <Eye size={20} />, color: 'text-blue-400 bg-blue-500/10' },
                        { title: 'Snapping with Mod', desc: 'Find active chats right now', icon: <MessageSquare size={20} />, color: 'text-emerald-400 bg-emerald-500/10' }
                      ].map((tool, i) => (
                        <div key={i} onClick={() => startScan(tool.title)} className="group bg-[#181c24] hover:bg-[#1f242e] border border-gray-800 rounded-2xl p-4 cursor-pointer transition shadow-lg">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-3.5">
                              <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${tool.color}`}>{tool.icon}</div>
                              <div>
                                <h3 className="font-bold text-sm group-hover:text-yellow-400 transition">{tool.title}</h3>
                                <p className="text-xs text-gray-400">{tool.desc}</p>
                              </div>
                            </div>
                            <ChevronRight size={18} className="text-gray-500 group-hover:text-yellow-400 transition" />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {activeTab === 'loading' && (
                  <div className="py-12 flex flex-col items-center justify-center text-center space-y-6">
                    <div className="w-16 h-16 rounded-full border-4 border-gray-800 border-t-yellow-400 animate-spin"></div>
                    <div className="space-y-1">
                      <h3 className="text-lg font-bold">Scanning @{targetUsername}</h3>
                      <p className="text-xs text-yellow-400 font-mono">{scanMessage}</p>
                    </div>
                    <div className="w-full max-w-xs bg-gray-800 h-2 rounded-full overflow-hidden">
                      <div className="bg-yellow-400 h-full transition-all duration-300" style={{ width: `${scanProgress}%` }}></div>
                    </div>
                  </div>
                )}

                {activeTab === 'results' && (
                  <div className="bg-[#12151a] border border-gray-800 rounded-3xl p-4 shadow-2xl space-y-4">
                    <div className="flex items-center justify-between border-b border-gray-800 pb-3">
                      <button onClick={() => setActiveTab('home')} className="p-1.5 rounded-xl bg-gray-800 text-xs font-semibold flex items-center gap-1"><ArrowLeft size={16} /> Back</button>
                      <div className="text-center">
                        <h2 className="font-extrabold text-sm">Best Friends</h2>
                        <p className="text-[10px] text-yellow-400">@{targetUsername}</p>
                      </div>
                      <button onClick={randomizeFriends} className="p-1.5 rounded-xl bg-gray-800 text-yellow-400"><RefreshCw size={14} /></button>
                    </div>

                    <div className="space-y-2 max-h-[400px] overflow-y-auto custom-scrollbar pr-1">
                      {currentFriendsList.map((friend, idx) => (
                        <div key={idx} className="flex items-center justify-between p-2.5 rounded-2xl bg-[#181c24] border border-gray-800">
                          <div className="flex items-center space-x-3">
                            <img src={friend.avatar} alt="" className="w-11 h-11 rounded-full object-cover border border-yellow-400/30" />
                            <div>
                              <div className="flex items-center gap-1.5">
                                <span className="font-bold text-sm">{friend.name}</span>
                                <span className="text-[11px] text-gray-400">@{friend.username}</span>
                              </div>
                              <div className="flex items-center gap-2 text-[11px] text-gray-400">
                                <span className="flex items-center gap-0.5 text-amber-400 font-semibold"><Flame size={12} /> {friend.streak}</span>
                                <span>•</span>
                                <span className="flex items-center gap-0.5"><Clock size={11} /> {friend.status}</span>
                              </div>
                            </div>
                          </div>
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-yellow-400/10 text-yellow-400">#{idx + 1}</span>
                        </div>
                      ))}
                    </div>

                    <button onClick={() => setActiveTab('home')} className="w-full py-2.5 bg-yellow-400 text-black font-bold text-xs rounded-xl">Try Another User</button>
                  </div>
                )}
              </main>

              <footer className="border-t border-gray-800/60 py-3 text-center text-xs text-gray-500">
                <p>© STREAKVADE UI • Prank Dashboard</p>
              </footer>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
